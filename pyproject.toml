[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "little-mcp-evo"
version = "0.6.0"
description = "A small, local-first AI agent built on a real Model Context Protocol server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=5",
    "geopy>=2.4",
    "timezonefinder>=6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "gradio>=6",
]

[project.optional-dependencies]
claude = ["langchain-anthropic>=1.7"]
mariadb = ["mariadb>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
all = ["little-mcp-evo[claude,dev]"]

[project.scripts]
little-mcp = "little_mcp.cli:main"
little-mcp-server = "little_mcp.server:main"

[tool.setuptools]
packages = ["little_mcp", "little_mcp.tinysql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Raised inside langsmith and chromadb on Python 3.14, not in this project.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
